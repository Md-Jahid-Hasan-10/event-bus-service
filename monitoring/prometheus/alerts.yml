groups:
  - name: banking-platform
    rules:
      - alert: ServiceDown
        expr: up{job="banking-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} has been down for more than 1 minute"

      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} returns more than 5 percent server errors"

      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0 or kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is not available"
      - alert: OutboxBacklog
        expr: outbox_pending_events > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} has {{ $value }} events waiting to be published to Kafka"

      - alert: DeadLettersPresent
        expr: |
          sum by (topic) (
            kafka_topic_partition_current_offset{topic=~".*\\.DLT"}
            - kafka_topic_partition_oldest_offset{topic=~".*\\.DLT"}
          ) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} message(s) are waiting in {{ $labels.topic }}"
      - alert: TransitBalanceStuck
        expr: cbs_transit_balance > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} has been in the transit account for more than 10 minutes. A transfer may be stuck"
      - alert: AccountsStuckPending
        expr: accounts_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} account(s) have waited more than 10 minutes for the ledger"
      - alert: TransferNeedsReconciliation
        expr: transfers_in_flight{status="RECONCILIATION_REQUIRED"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} transfer(s) need reconciliation, money may be in transit"

      - alert: TransfersStuckInMotion
        expr: sum(transfers_in_flight{status=~"WITHDRAWING|DEPOSITING|REVERSING"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} transfer(s) have been moving money for more than 5 minutes"

  - name: communication
    rules:
      - alert: CircuitBreakerOpen
        expr: max by (application, name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: the circuit to {{ $labels.name }} has been open for a minute. Is that service down?"

      - alert: DownstreamTimeoutsFrequent
        expr: sum by (application, target) (rate(client_calls_seconds_count{exception="DownstreamTimeoutException"}[5m])) * 60 > 3
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} gets more than 3 timeouts per minute from {{ $labels.target }}"

      - alert: EmailPermanentFailure
        expr: sum(increase(notifications_email_failures_total{kind="permanent"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Emails fail for good (wrong Gmail password or a refused address). Retrying will not help"

      - alert: BalancesDegraded
        expr: sum(increase(accounts_balances_degraded_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Customers see accounts without balances. Core Banking is not answering"