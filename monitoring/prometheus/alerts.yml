groups:
  - name: banking-platform
    rules:
      - alert: ServiceDown
        expr: up{job="banking-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} has been down for more than 1 minute"

      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} returns more than 5 percent server errors"

      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0 or kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is not available"
      - alert: OutboxBacklog
        expr: outbox_pending_events > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} has {{ $value }} events waiting to be published to Kafka"

      - alert: DeadLettersPresent
        expr: |
          sum by (topic) (
            kafka_topic_partition_current_offset{topic=~".*\\.DLT"}
            - kafka_topic_partition_oldest_offset{topic=~".*\\.DLT"}
          ) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} message(s) are waiting in {{ $labels.topic }}"