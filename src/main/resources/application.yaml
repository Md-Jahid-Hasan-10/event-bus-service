server:
  port: 8090

spring:
  application:
    name: kafka-event-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Stop the service at startup if Kafka cannot be reached, with a clear error.
      fail-fast: true
      # If someone changes a topic setting by hand, the next start puts it back.
      modify-topic-configs: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  server:
    port: 18090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  kafka:
    replication-factor: 1

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB